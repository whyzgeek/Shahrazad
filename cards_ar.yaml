# Arabic versions of the card reminders and rules, used for advanced learners. Written and reviewed by hand.
adjective_gender:
  reminder: النعت يتبع منعوته في التذكير والتأنيث.
  rule: يتبع النعت الحقيقي منعوته في التذكير والتأنيث والتعريف والتنكير والإعراب.
adjective_definiteness:
  reminder: النعت يتبع منعوته في التعريف والتنكير.
  rule: إذا كان المنعوت معرفة كان النعت معرفة، وإذا كان نكرة كان النعت نكرة.
adjective_number:
  reminder: النعت يطابق المثنى والجمع العاقل في العدد.
  rule: يطابق النعت منعوته المثنى والجمع العاقل في العدد، أما جمع غير العاقل فله حكم آخر.
nonhuman_plural:
  reminder: جمع غير العاقل يعامل معاملة المفردة المؤنثة.
  rule: إذا دل الجمع على غير العاقل عومل معاملة المفردة المؤنثة في النعت والخبر والفعل والضمير.
verb_person:
  reminder: تتغير صيغة الفعل بحسب فاعله.
  rule: لكل ضمير صيغته من الفعل، ويغني حرف المضارعة أو الضمير المتصل غالبا عن ذكر الضمير المنفصل.
verb_tense:
  reminder: الماضي لما انقضى، والمضارع للحال والعادة.
  rule: يدل الماضي على ما انقضى، والمضارع على الحال أو العادة، وتدخل السين أو سوف على المضارع للدلالة على الاستقبال.
verb_subject_agreement:
  reminder: إذا تقدم الفعل على فاعله أفرد وطابقه في الجنس.
  rule: إذا تقدم الفعل على الفاعل الظاهر بقي مفردا وطابقه في التذكير والتأنيث، وإذا تأخر عن المبتدأ طابقه مطابقة تامة.
preposition:
  reminder: بعض الأفعال تتعدى بحرف جر مخصوص.
  rule: تتعدى أفعال كثيرة بحرف جر مخصوص يحفظ معها، وقد يتغير المعنى بتغير الحرف.
idafa:
  reminder: المضاف لا تدخله أل ولا التنوين.
  rule: المضاف إليه مجرور دائما، ويحذف من المضاف التنوين ونون المثنى وجمع المذكر السالم، ولا تدخل عليه أل.
numbers_gender:
  reminder: الأعداد من ٣ إلى ١٠ تخالف المعدود في الجنس.
  rule: تخالف الأعداد من ثلاثة إلى عشرة معدودها في التذكير والتأنيث، والعبرة بمفرد المعدود.
counted_noun:
  reminder: العدد يحدد صيغة تمييزه وإعرابه.
  rule: تمييز الأعداد من ثلاثة إلى عشرة جمع مجرور، ومن أحد عشر إلى تسعة وتسعين مفرد منصوب، وتمييز المئة والألف مفرد مجرور.
dual:
  reminder: المثنى يرفع بالألف وينصب ويجر بالياء.
  rule: يرفع المثنى بالألف وينصب ويجر بالياء، وتحذف نونه عند الإضافة، ولا يذكر معه العدد.
plural_form:
  reminder: انتبه إلى صيغة الجمع.
  rule: يجمع المذكر العاقل غالبا جمعا سالما، والمؤنث بالألف والتاء، ولجمع التكسير أوزان تحفظ مع الكلمة.
case_ending:
  reminder: العلامة الإعرابية تبين موقع الكلمة في الجملة.
  rule: يرفع الفاعل والمبتدأ والخبر، وينصب المفعول به والحال والتمييز، ويجر الاسم بعد حرف الجر والمضاف إليه.
inna_kana:
  reminder: كان ترفع الاسم وتنصب الخبر، وإن تنصب الاسم وترفع الخبر.
  rule: ترفع كان وأخواتها المبتدأ وتنصب الخبر، وتنصب إن وأخواتها المبتدأ وترفع الخبر.
negation:
  reminder: أداة النفي تتبع الزمن المقصود.
  rule: تنفي ما الماضي، ولا المضارع، وتجزم لم المضارع وتقلب زمنه إلى الماضي، وتنصب لن المضارع للاستقبال، وتنفي ليس الجملة الاسمية.
pronoun:
  reminder: يطابق الضمير واسم الموصول ما يعودان عليه.
  rule: يطابق الضمير واسم الموصول ما يعودان عليه في الجنس والعدد، ويعامل جمع غير العاقل معاملة المفردة المؤنثة.
word_order:
  reminder: انتبه إلى ترتيب الكلمات.
  rule: يأتي النعت بعد منعوته، ويتصل الضمير المضاف بآخر الاسم.
word_choice:
  reminder: كلمة أخرى أنسب هنا.
  rule: هذه الكلمة لا تناسب المعنى أو الاستعمال الفصيح.
other:
  reminder: هذه الصيغة تحتاج إلى تصحيح.
  rule: هذه الصيغة غير صحيحة في العربية الفصحى.
