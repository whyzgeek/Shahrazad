name: tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements/tutor.txt -r requirements/dev.txt
      - run: timeout 600 python -m playwright install --with-deps chromium
      # Python logic and routes, whole conversations against fake models, the page's code under Node, and the page
      # in a phone-sized browser.
      - run: PYTHON=python scripts/test.sh
