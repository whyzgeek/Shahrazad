[project]
name = "shahrazad-agent"
version = "0.1.0"
description = "Shahrazad MSA voice tutor — LiveKit agent + FastAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents>=0.12.0",
    "livekit-plugins-openai>=0.10.0",
    "livekit-api>=0.6.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "mishkal>=0.4.0",
    "openai>=1.50.0",
]

[project.scripts]
shahrazad-api = "shahrazad_agent.api.main:run"
shahrazad-agent = "shahrazad_agent.agent.worker:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shahrazad_agent"]
