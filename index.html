<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arabic Tutor</title>
<style>
:root{--bg:#f7f5f0;--fg:#1f1f1c;--mut:#6b6960;--line:#ddd8cc;--card:#fff;--acc:#0f6b5c;--acc2:#b3401f;--me:#e8f1ee}
@media (prefers-color-scheme:dark){:root{--bg:#191a18;--fg:#ecebe6;--mut:#a3a197;--line:#35362f;--card:#232420;--acc:#2f8f7d;--acc2:#c0603f;--me:#22332e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0}button{font:inherit;cursor:pointer}.hd{display:flex;gap:8px;align-items:center;min-width:0}#sessions{max-width:min(46vw,320px);font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg)}#reset{white-space:nowrap;background:none;border:1px solid var(--line);color:var(--mut);border-radius:6px;padding:4px 10px}
#wrap{flex:1;display:flex;min-height:0}#log{flex:1;min-width:0;overflow-y:auto;padding:16px;max-width:760px;margin:0 auto}#notes{width:280px;flex:none;overflow-y:auto;padding:12px 14px;border-left:1px solid var(--line)}#notes h2{font-size:13px;margin:0 0 8px;color:var(--mut);font-weight:600}.note{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:13px}.note .fix{font-family:'Noto Naskh Arabic',Amiri,Tahoma,serif;font-size:1.25em;line-height:1.8}.note s{color:var(--acc2)}.note b{color:var(--acc);font-weight:600}.note .c{color:var(--mut);font-size:12px}.note button{background:none;border:0;padding:0;color:var(--mut);font-size:12px;text-decoration:underline}.note .act{display:flex;gap:12px;margin-top:4px}.lesson{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}.lesson p{margin:4px 0}.lesson ul{margin:4px 0;padding-right:18px;font-family:'Noto Naskh Arabic',Amiri,Tahoma,serif;font-size:1.15em;line-height:1.7}.lesson .trap{color:var(--mut)}@media (max-width:800px){#wrap{flex-direction:column}#notes{width:auto;max-height:26vh;border-left:0;border-top:1px solid var(--line)}}
.m{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0}.me{background:var(--me)}
.ar{font-family:'Noto Naskh Arabic',Amiri,Tahoma,serif;font-size:1.45em;line-height:1.9}.t{color:var(--acc);font-size:1.3em;margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.src{font-size:13px;color:var(--mut);margin:6px 2px}.src a{color:var(--acc)}.replay.on{background:var(--acc);border-color:var(--acc);color:#fff}.replay{display:block;margin-top:6px;background:none;border:1px solid var(--line);border-radius:6px;color:var(--mut);font-size:12px;padding:2px 8px}.who{font-size:12px;color:var(--mut)}.time{font-size:12px;color:var(--mut);margin-top:4px}
footer{padding:12px 16px 18px;border-top:1px solid var(--line);max-width:760px;width:100%;margin:auto}
#talk{width:100%;padding:18px;font-size:18px;border:0;border-radius:10px;background:var(--acc);color:#fff;touch-action:none;user-select:none}#talk.on{background:var(--acc2)}#talk:disabled{opacity:.5}
form{display:flex;gap:8px;margin-top:10px}#txt{flex:1;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);min-width:0}form button{padding:8px 14px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg)}
#st{font-size:13px;color:var(--mut);margin-top:6px;min-height:1.2em}
</style>
<header><h1>Arabic speaking tutor</h1><div class="hd"><select id="sessions" aria-label="Conversation"></select><button id="reset">New conversation</button></div></header>
<div id="wrap"><div id="log"></div><aside id="notes" hidden><h2>Corrections</h2><div id="notelist"></div></aside></div>
<footer><button id="talk" disabled>Connecting…</button>
<form id="f"><input id="txt" dir="auto" placeholder="Type here, or paste a YouTube link" autocomplete="off"><button>Send</button></form><div id="st"></div></footer>
<script>
const $=i=>document.getElementById(i),log=$('log'),talk=$('talk'),st=$('st');
const IDLE='Hold to talk (or hold the space bar)';
let ws,me,bot,talking=false,mic,node,ctx,play,nextAt=0,sources=[],limit;
function bubble(cls,who){const d=document.createElement('div');d.className='m '+cls;
 const w=document.createElement('div');w.className='who';w.textContent=who;
 const b=document.createElement('div');b.className='ar';b.dir='auto';d.append(w,b);log.append(d);log.scrollTop=log.scrollHeight;return d}
const setBody=(d,t)=>{d.querySelector('.ar').textContent=t;log.scrollTop=log.scrollHeight};
function addNote(e){$('notes').hidden=false;const n=document.createElement('div');n.className='note';
 const f=document.createElement('div');f.className='fix';f.dir='rtl';const s=document.createElement('s');s.textContent=e.wrong;const b=document.createElement('b');b.textContent=e.right;f.append(s,' ← ',b);
 const c=document.createElement('div');c.className='c';c.textContent=e.concept;
 const r=document.createElement('div');r.dir='auto';r.textContent=e.reminder;
 const more=document.createElement('button');more.textContent='Explain this';let box=null;
 more.onclick=async()=>{if(box){box.remove();box=null;more.textContent='Explain this';return}
  const l=await(await fetch('lesson/'+encodeURIComponent(e.key))).json();box=document.createElement('div');box.className='lesson';
  const p=document.createElement('p');p.dir='auto';p.textContent=l.rule;box.append(p);
  if(l.examples){const u=document.createElement('ul');u.dir='rtl';l.examples.forEach(t=>{const li=document.createElement('li');li.textContent=t;u.append(li)});box.append(u)}
  if(l.trap){const t=document.createElement('p');t.className='trap';t.textContent=l.trap;box.append(t)}
  n.insertBefore(box,more.parentNode);more.textContent='Hide'};
 const act=document.createElement('div');act.className='act';
 const x=document.createElement('button');x.textContent="That's not what I said";x.onclick=()=>{ws.send(JSON.stringify({type:'dismiss',id:e.id}));n.remove();if(!$('notelist').children.length)$('notes').hidden=true};
 act.append(more,x);n.append(f,c,r,act);$('notelist').prepend(n)}
function addReplay(el,id){if(el.querySelector('.replay'))return;const b=document.createElement('button');b.className='replay';b.textContent='▶ Replay';
 b.onclick=()=>{stopAudio();play=play||new AudioContext();play.resume();replayBtn=b;replayDone=false;b.classList.add('on');ws.send(JSON.stringify({type:'replay',turn:id}))};el.append(b)}
function card(kind,title,url){const d=document.createElement('div');d.className='src';const b=document.createElement('b');b.textContent=kind+': ';d.append(b);
 if(/^https?:\/\//.test(url)){const l=document.createElement('a');l.href=url;l.target='_blank';l.rel='noopener noreferrer';l.textContent=title;d.append(l)}else d.append(title);log.append(d);log.scrollTop=log.scrollHeight}
let replayBtn=null,replayDone=false,decoding=0;
function endReplay(){if(replayBtn)replayBtn.classList.remove('on');replayBtn=null;replayDone=false}
function checkReplay(){if(replayBtn&&replayDone&&decoding===0&&sources.length===0)endReplay()}
function stopAudio(){sources.forEach(s=>{try{s.stop()}catch(e){}});sources=[];nextAt=0;endReplay()}
async function queue(buf){decoding++;try{play=play||new AudioContext();if(play.state==='suspended')await play.resume();
 const a=await play.decodeAudioData(buf),s=play.createBufferSource();s.buffer=a;s.connect(play.destination);
 const at=Math.max(play.currentTime+.03,nextAt);s.start(at);nextAt=at+a.duration;sources.push(s);s.onended=()=>{sources=sources.filter(x=>x!==s);checkReplay()}}finally{decoding--;checkReplay()}}
function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');ws.binaryType='arraybuffer';
 ws.onopen=()=>{talk.disabled=false;talk.textContent=IDLE;st.textContent=''};
 ws.onclose=()=>{talk.disabled=true;talk.textContent='Reconnecting…';setTimeout(connect,1500)};
 ws.onmessage=e=>{if(typeof e.data!=='string'){queue(e.data);return}const m=JSON.parse(e.data);
  if(m.type==='partial'){if(me)setBody(me,m.text)}
  else if(m.type==='final'){if(me)setBody(me,m.text||'…');st.textContent=m.text?'Thinking…':''}
  else if(m.type==='assistant'){if(!bot)bot=bubble('','Tutor');setBody(bot,m.text);st.textContent=''}
  else if(m.type==='status'){st.textContent=m.text}
  else if(m.type==='subject'){card(m.kind==='video'?'Video':'Article',m.title+(m.sections>1?' ('+m.section+'/'+m.sections+')':''),m.url);st.textContent=''}
  else if(m.type==='items'){m.items.forEach((it,i)=>card('Option '+(i+1),it.title,it.url));st.textContent=''}
  else if(m.type==='turn'&&bot){addReplay(bot,m.id)}
  else if(m.type==='replay_done'){replayDone=true;checkReplay()}
  else if(m.type==='errors'){m.errors.forEach(addNote)}
  else if(m.type==='sessions'){const v=$('sessions');v.textContent='';m.sessions.forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.title+' ('+x.turns+')';v.append(o)});v.value=String(m.current)}
  else if(m.type==='session'){stopAudio();me=bot=null;log.textContent='';$('notelist').textContent='';$('notes').hidden=true;st.textContent='';if(m.subject)card(m.subject.kind==='video'?'Video':'Article',m.subject.title,m.subject.url);m.turns.forEach(t=>{setBody(bubble('me','You'),t.said);const b=bubble('','Tutor');setBody(b,t.reply);if(t.id)addReplay(b,t.id)});m.errors.forEach(addNote);bot=null;me=null}
  else if(m.type==='text_only'){st.textContent='Shown as text only: the Arabic voice can’t read that language.'}
  else if(m.type==='tashkeel'&&bot){let t=bot.querySelector('.t');if(!t){t=document.createElement('div');t.className='ar t';t.dir='auto';bot.append(t)}t.textContent=m.text;log.scrollTop=log.scrollHeight}
  else if(m.type==='timing'&&bot){const t=document.createElement('div');t.className='time';t.textContent='First audio '+(m.end_of_speech_to_first_audio_s??'–')+' s after you stopped';bot.append(t)}
  else if(m.type==='error'){st.textContent=m.text}}}
const WORK=`class P extends AudioWorkletProcessor{constructor(){super();this.r=sampleRate/16000;this.a=0;this.n=0;this.p=0;this.b=new Int16Array(1280);this.i=0}
process(inp){const c=inp[0][0];if(!c)return true;for(let k=0;k<c.length;k++){this.a+=c[k];this.n++;this.p++;if(this.p>=this.r){this.p-=this.r;const v=Math.max(-1,Math.min(1,this.a/this.n));this.a=0;this.n=0;this.b[this.i++]=v*32767;if(this.i===1280){this.port.postMessage(this.b.buffer.slice(0));this.i=0}}}return true}}registerProcessor('p',P)`;
async function initMic(){if(mic)return;mic=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
 ctx=new AudioContext();await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORK],{type:'text/javascript'})));
 node=new AudioWorkletNode(ctx,'p');ctx.createMediaStreamSource(mic).connect(node);node.port.onmessage=e=>{if(talking&&ws.readyState===1)ws.send(e.data)}}
async function down(){if(talking||talk.disabled)return;talking=true;
 try{await initMic();await ctx.resume()}catch(e){talking=false;st.textContent='Microphone unavailable. Open this page at http://localhost:8791 through the SSH tunnel and allow the mic.';return}
 if(!talking)return; // released during the permission prompt
 stopAudio();bot=null;me=bubble('me','You');talk.classList.add('on');talk.textContent='Listening… release when done';st.textContent='';ws.send(JSON.stringify({type:'start'}));limit=setTimeout(up,300000)}
function up(){if(!talking)return;talking=false;clearTimeout(limit);talk.classList.remove('on');talk.textContent=IDLE;setTimeout(()=>ws.send(JSON.stringify({type:'stop'})),120)}
talk.onpointerdown=e=>{e.preventDefault();talk.setPointerCapture(e.pointerId);down()};talk.onpointerup=up;talk.onpointercancel=up;
addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&document.activeElement!==$('txt')){e.preventDefault();down()}});
addEventListener('keyup',e=>{if(e.code==='Space'&&document.activeElement!==$('txt')){e.preventDefault();up()}});
$('f').onsubmit=e=>{e.preventDefault();const v=$('txt').value.trim();if(!v)return;$('txt').value='';stopAudio();bot=null;play=play||new AudioContext();play.resume();setBody(bubble('me','You'),v);ws.send(JSON.stringify({type:'text',text:v}))};
$('reset').onclick=()=>{ws.send(JSON.stringify({type:'reset'}))};
$('sessions').onchange=e=>{ws.send(JSON.stringify({type:'switch',id:Number(e.target.value)}))};
connect();
</script></html>
